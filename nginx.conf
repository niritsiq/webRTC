# Serve the app over plain HTTP (for this PC) and HTTPS (for other machines on the network)
server {
    # Plain HTTP; the camera only works here on localhost
    listen 80;
    # HTTPS with the self-signed certificate made in the Dockerfile; needed for the camera on other machines
    listen 443 ssl;

    # Certificate and private key created at build time
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Folder holding index.html and the scripts
    root  /usr/share/nginx/html;
    # Page shown for the bare address
    index index.html;
}
